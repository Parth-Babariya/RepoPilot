embeddings:
 # Free, local (fastembed — downloaded once, no API key). bge-small matched bge-base's
 # accuracy on data/evals/questions.yaml and indexes ~3x faster (see rag: below for current numbers).
 # Switching model builds a fresh index automatically (one collection per model).
 # fastembed runs Hugging Face models (BGE, Jina, …) via ONNX — no PyTorch needed.
 provider: fastembed      # fastembed | openai
 model: BAAI/bge-small-en-v1.5
 # Paid OpenAI setup:
 #   provider: openai
 #   model: text-embedding-3-small

semantic_cache:
 enabled: true
 redis_url: redis://localhost:6379
 # Windows: Redis runs inside this WSL distro and is started automatically when
 # RepoPilot starts (it then stays up until Windows restarts). Leave empty on
 # Linux/macOS, with Docker, or with a cloud Redis URL.
 wsl_distro: Ubuntu-24.04
 threshold: 0.85
 ttl: 86400
 # A match that isn't the same text is confirmed by judge_model before its answer is reused:
 # "What calls X?" and "What does X call?" are 0.98 similar but need different answers.
 confirm_matches: true

tasks:
 db_path: .repopilot/tasks.db
 verify_timeout_seconds: 120   # limit for each task's verify_command (e.g. running its tests)
 max_replans: 1                # times per /plan run a failed task may be re-planned (0 = never)
 # worktree: tasks work in a separate git worktree on their own branch; when the plan
 #   finishes you see the diff and apply it to your checkout, keep the branch, or discard it.
 #   Needs a git repo with at least one commit (otherwise RepoPilot works in place and says so).
 #   The worktree starts from your last commit — uncommitted changes and untracked files
 #   (node_modules/, .venv/) aren't in it.
 # none: tasks write straight into the folder RepoPilot runs in.
 isolation: worktree

ask:
 # Search the code for the question before the agent starts and include the results, so
 # the agent often answers without a model call spent deciding to search. Skipped for
 # follow-ups about the previous answer ("explain that more").
 initial_search: true
 # Each /ask answer is checked before you see it: cited files and line numbers must exist
 # (code, free), then the judge model checks the answer's claims against the code the agent
 # retrieved (one cheap LLM call). An answer that fails gets one revision.
 verify: true
 verify_with_llm: true
 max_revisions: 1

budgets:
 # Hard limits so a looping agent can't run up cost. 0 = no token limit.
 ask_tokens: 250000      # all LLM calls for one /ask (largest measured so far: ~75k)
 plan_tokens: 1000000    # all LLM calls for one /plan run (measured: 40k-105k). When it runs out
                         # the plan pauses with its progress saved; /plan again resumes it.
 qa_tool_calls: 15       # per /ask answer — past this the agent must answer with what it found
 task_tool_calls: 40     # per /plan task attempt
 model_calls: 30         # per agent run — past this the run ends with a message

safety:
 # Agents can only read/write inside the folder RepoPilot runs in, and never .env files.
 workspace_only: true
 # Common read-only/build/test commands run directly. Anything else asks you first
 # (false = refuse instead). During /eval nobody can answer, so those are refused.
 confirm_other_commands: true
 # Keep only MCP tools that read (GitHub get/list/search, filesystem read) —
 # RepoPilot never needs to push, open PRs or edit files through MCP.
 mcp_read_only: true

llm:
 # Free: Gemini (key from https://aistudio.google.com/apikey → GOOGLE_API_KEY in .env).
 # Model names change — list the ones your key can use: python -m repopilot.services.list_models
 # (a listed model can still refuse new users: gemini-2.5-flash did in Oct 2026 — test with /ask)
 provider: gemini                     # openai | anthropic | gemini | groq
 # Free-tier daily caps differ per model: gemini-3.5-flash allows only 20 requests/day
 # (too few for /plan or /eval), so the default is flash-lite. Use flash for one-off /ask.
 model: gemini-3.5-flash-lite
 judge_model: groq:openai/gpt-oss-20b  # LLM-as-judge and answer checks; Groq keeps them off Gemini's quota
 max_retries: 6                       # back off and retry on rate limits (free tiers allow few requests/minute)
 timeout_seconds: 120                 # a request that hangs longer fails (and is retried) instead of freezing the run
 # Used when the main (or judge) model still fails after its retries — e.g. a free-tier model
 # answering 503 "overloaded" for minutes. Empty = no fallback. Write "provider:model" to use
 # another provider, e.g. gemini:gemini-3.5-flash when provider is groq.
 fallback_model: gemini-3.5-flash
 # Groq (free, very fast; key from https://console.groq.com/keys → GROQ_API_KEY in .env;
 # models: console.groq.com/docs/models). Free tier, per model: 1000 requests/day,
 # 8000 tokens/minute and 200,000 tokens/day — one /ask request passes the per-minute limit
 # after a few searches, so Groq suits the judges (short prompts) better than the agents.
 # A full /eval spends ~85k judge tokens, so about two runs a day fit. Free mix that takes
 # the /ask checks and eval judging off Gemini's quota:
 #   judge_model: groq:openai/gpt-oss-20b    # qwen/qwen3.8-27b also works
 # All-Groq (fine for short questions; long ones fall back to Gemini):
 #   provider: groq
 #   model: openai/gpt-oss-120b
 #   judge_model: openai/gpt-oss-20b
 #   fallback_model: gemini:gemini-3.5-flash
 # Paid OpenAI setup:
 #   provider: openai
 #   model: gpt-5.5
 #   judge_model: gpt-4o-mini

skills:
 # Built-in skills (trace_flow, review_code, debug_error) always load. Put your own in
 # <skills_dir>/<name>/SKILL.md in the analysed repo — a same-named skill overrides a built-in.
 skills_dir: .repopilot/skills

memory:
 db_path: .repopilot/memory/memory.db
 # Summarise older messages once a session's history passes this size. Keep it well above
 # what one answer needs: at 4000, a few search results triggered it mid-answer, the summary
 # replaced the question and retrieved code, and the agent looped re-running the same searches.
 summarize_at_tokens: 40000
 keep_last_messages: 20

chromadb:
 persist_dir: .repopilot/chromadb/
 collection_name: codebase

rag:
 # semantic = vector search · hybrid = vector + BM25 keyword search merged by rank
 # (works with Chroma and Qdrant). Measured with scripts/benchmark_retrieval.py
 # (bge-small, hit@5 / MRR): semantic 92% / 0.68 · + rerank 88% / 0.69 ·
 # hybrid 92% / 0.75 · hybrid + rerank 92% / 0.67. Hybrid became the best once module-level
 # code (constants, config tables) was indexed — keyword search finds exact names such as
 # _ALWAYS_DENIED that the agent searches for. Rerun the script on your own repo to compare.
 mode: hybrid             # semantic | hybrid

vector_store:
 # chroma: local, stored in the repo's .repopilot/ (default) · qdrant: a server or Qdrant Cloud
 # (QDRANT_URL in .env). Both support rag.mode semantic and hybrid without re-indexing.
 provider: chroma         # chroma | qdrant

rerank:
 # Off by default: on data/evals/questions.yaml it adds nothing to hybrid search (hit@5 92%
 # either way, MRR 0.75 → 0.67), because the cross-encoder favours text that *reads* like the
 # question — test names, README prose — over the code that implements the answer. It also
 # costs ~1.7s per search on a laptop CPU. It may suit repos with less prose; measure first.
 enabled: false           # vector search fetches `candidates` chunks, a local cross-encoder keeps the best k
 # jina-v1-tiny beat ms-marco-MiniLM-L-6 and jina-v1-turbo in a reranker comparison, and was fastest
 model: jinaai/jina-reranker-v1-tiny-en
 candidates: 20           # more = better recall but slower (~0.06s per candidate on a laptop CPU)

usage:
 db_path: .repopilot/usage.db
 # USD per 1M tokens, used for /stats cost estimates. Prices change —
 # check https://openai.com/api/pricing and update. Unlisted models show "?".
 prices:
   gemini-3.5-flash:       {input: 0, output: 0}    # free tier (paid tier is billed differently)
   gemini-3.5-flash-lite:  {input: 0, output: 0}    # free tier
   openai/gpt-oss-120b:    {input: 0, output: 0}    # Groq free tier
   openai/gpt-oss-20b:     {input: 0, output: 0}    # Groq free tier
   qwen/qwen3.8-27b:       {input: 0, output: 0}    # Groq free tier
   BAAI/bge-small-en-v1.5: {input: 0, output: 0}    # local embeddings — always free
   BAAI/bge-base-en-v1.5:  {input: 0, output: 0}
   jinaai/jina-embeddings-v2-base-code: {input: 0, output: 0}
   gpt-5.5:                {input: 5.00, output: 30.00}
   gpt-4o-mini:            {input: 0.15, output: 0.60}
   text-embedding-3-small: {input: 0.02, output: 0}

symbols:
 enabled: true            # symbol + call-graph tools for /ask
 db_path: .repopilot/symbols.db

eval:
 questions_file: data/evals/questions.yaml   # relative to the repo RepoPilot is run in
 results_dir: .repopilot/evals
 top_k: 5
 delay_seconds: 15        # pause between questions to stay under free-tier rate limits (0 for paid APIs)

qdrant:
 collection_name: repopilot
