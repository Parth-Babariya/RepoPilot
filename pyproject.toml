[project]
name = "repopilot"
version = "0.1.0"
description = "RepoPilot — agentic AI code assistant with RAG code search and multi-agent project planning"
authors = [
    {name = "Parth Babariya", email = "parthbabariya0000@gmail.com"}
]
readme = "README.md"
# 3.12 only: tree-sitter-languages 1.10.2 has no wheels for 3.13+
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "langchain (>=1.3.11,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-openai (>=1.3.3,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-anthropic (>=1.4.7,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-qdrant (>=1.1.0,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "fastembed (>=0.8.0,<0.9.0)",
    "langgraph-checkpoint-sqlite (>=3.1.0,<4.0.0)",
    "tree-sitter (==0.21.3)",
    "tree-sitter-languages (==1.10.2)",
    "langchain-mcp-adapters (>=0.3.0,<0.4.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "redis (>=7.4.1,<8.0.0)",
    "redisvl (>=0.23.0,<0.24.0) ; python_version >= \"3.12\" and python_version < \"3.15\"",
    "langchain-google-genai (>=4.4.2,<5.0.0)",
    "langchain-groq (>=1.0,<2.0)"
]


[project.scripts]
# Installs a `repopilot` command (repopilot.exe on Windows) in the environment
repopilot = "repopilot.main:run"


[tool.poetry]
# Poetry manages dependencies; setuptools (below) installs the package, because
# Poetry can't install src/ under the name `repopilot`. After `poetry install`, run:
#   poetry run pip install -e . --no-deps
package-mode = false


[tool.setuptools]
# The code lives directly in src/ but is installed as the `repopilot` package,
# so imports are `from repopilot.agents import …` and the command is `repopilot`.
package-dir = {"repopilot" = "src"}
packages = [
    "repopilot",
    "repopilot.agents",
    "repopilot.config",
    "repopilot.evaluation",
    "repopilot.guardrails",
    "repopilot.memory",
    "repopilot.observability",
    "repopilot.protocols",
    "repopilot.retrieval",
    "repopilot.retrieval.indexing",
    "repopilot.retrieval.search",
    "repopilot.services",
    "repopilot.skills",
    "repopilot.tools",
    "repopilot.workflows",
]

[tool.setuptools.package-data]
"repopilot.config" = ["config.yaml", "mcp_servers.json"]
"repopilot.skills" = ["builtin/*/SKILL.md"]


[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.17"


[tool.pytest.ini_options]
# `import repopilot` comes from the installed package (poetry install);
# "." makes `import tests.…` work
pythonpath = ["."]
testpaths = ["tests"]


[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"


[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors, import order, bugbear, modern syntax
select = ["F", "E", "I", "B", "UP"]
ignore = ["E501"]   # the formatter handles length; long strings and URLs are fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811"]   # pytest fixtures imported from another test module look like redefinitions
