[project]
name = "repopilot"
version = "0.1.0"
description = "RepoPilot — agentic AI code assistant with RAG code search and multi-agent project planning"
authors = [
    {name = "Parth Babariya", email = "parthbabariya0000@gmail.com"}
]
readme = "README.md"
# 3.12 only: tree-sitter-languages 1.10.2 has no wheels for 3.13+
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "openai (>=2.43.0,<3.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "langchain (>=1.3.11,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-openai (>=1.3.3,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-anthropic (>=1.4.7,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-huggingface (>=1.2.2,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-qdrant (>=1.1.0,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "fastembed (>=0.8.0,<0.9.0)",
    "langgraph-checkpoint-sqlite (>=3.1.0,<4.0.0)",
    "tree-sitter (==0.21.3)",
    "tree-sitter-languages (==1.10.2)",
    "langchain-mcp-adapters (>=0.3.0,<0.4.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "redis (>=7.4.1,<8.0.0)",
    "redisvl (>=0.23.0,<0.24.0) ; python_version >= \"3.12\" and python_version < \"3.15\"",
    "langchain-google-genai (>=4.4.2,<5.0.0)"
]


[project.scripts]
# Installs a `repopilot` command (repopilot.cmd on Windows) in the environment
repopilot = "repopilot.main:run"


[tool.poetry]
packages = [{include = "repopilot", from = "src"}]


[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"


[tool.pytest.ini_options]
# "src" makes `import repopilot` work, "." makes `import tests.…` work
pythonpath = ["src", "."]
testpaths = ["tests"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
